name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  security-events: write
  pull-requests: write

jobs:
  terraform:
    # Reusable workflow already sets its own job names (Validate/Plan/Apply/
    # Integration Tests). Do NOT set `name:` here.
    #
    # Pinned to a specific commit on gha-workflows for reproducibility.
    # Bump after merging the gha-workflows audit branch and cutting a tag.
    uses: melorga/gha-workflows/.github/workflows/terraform.yml@15a8350d9348fa60f9cf4148aca766460e3eca10
    with:
      terraform_version: '1.15.1'
      working_directory: './infrastructure'
      environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      aws_role_arn: ${{ vars.AWS_OIDC_ROLE_ARN }}
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}

  kubernetes-lint:
    name: Kubernetes Manifests Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v
      - name: Validate Kubernetes manifests
        run: kubeconform -summary -strict -ignore-missing-schemas kubernetes/

  k8s-security:
    name: Kubernetes Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Trivy filesystem scan (manifests + repo)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  iac-security:
    name: Terraform / IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Trivy config scan (infrastructure)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'infrastructure/'
          format: 'sarif'
          output: 'trivy-iac.sarif'

      - name: Upload Trivy IaC scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-iac.sarif'
